name = "durandcoldicott-github-io"
main = "_worker.js"
compatibility_date = "2026-08-30"

[assets]
directory = "."
binding = "ASSETS"
# /panana (the te reo app) is behind a login, so its static files must go
# through the Worker's session check instead of being served directly.
# /reo is its old address, which the Worker redirects.
run_worker_first = ["/panana", "/panana/*", "/reo", "/reo/*"]

# Panana practice reminders (push notifications) are checked every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f19f1acb96f440ee9e2361c34a2eaa27"

# Panana's own storage. Create a KV namespace called "panana" in the
# Cloudflare dashboard (Storage & Databases > KV), paste its ID below and
# remove the "#"s. On the next request Panana copies its existing "reo:" data
# across from RATE_LIMIT_KV automatically.
# [[kv_namespaces]]
# binding = "REO_KV"
# id = "PASTE-THE-NEW-NAMESPACE-ID-HERE"

# ANTHROPIC_API_KEY is a secret, configured directly in the Cloudflare
# dashboard (Settings > Environment variables) — it must never be written
# here in plain text, and a plain "wrangler deploy" doesn't touch secrets
# set that way, so it's unaffected by this file.

# /panana uses two more secrets, also set in the dashboard as type "Secret":
#   REO_INVITE_CODE  the code people need to create an account
#   REO_ADMINS       comma-separated usernames who can see the invite code
#                    and reset members' passwords
# Optional bot check on sign-in / sign-up (off until both are set):
#   TURNSTILE_SITE_KEY  (can be plain text)  and  TURNSTILE_SECRET  (Secret)
# Its data lives in RATE_LIMIT_KV under the "reo:" prefix, or in REO_KV once
# that's bound (above).
